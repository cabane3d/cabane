packages:
  - packages/*
  - apps/*

# Dependency install scripts. Platform binaries come from optional dependencies, so these
# packages work without running their scripts: esbuild (Storybook) only verifies its binary,
# msw (optional peer of Vitest's mocker) copies a service worker Cabane does not use.
allowBuilds:
  esbuild: false
  msw: false

# glob <= 14.0.1 has a moderate advisory (GHSA-3g3m-2fjr-6pw4). Storybook's docgen plugin still
# asks for glob ^13; Storybook builds with its docgen working on glob 14.
overrides:
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": ^14.0.6
