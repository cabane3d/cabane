name: Close external pull requests

# Cabane is open source, not open contribution (ADR-0001).
# This workflow never checks out or runs code from the pull request.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "Thank you for your interest in Cabane! The project is open source but does not accept external contributions, so this pull request is closed automatically. Bug reports and ideas are welcome in the Discussions."
